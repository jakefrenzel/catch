name: TestFlight

# Archives a Release build and uploads it to App Store Connect, where it shows
# up in TestFlight. Run it by hand:
#
#   gh workflow run testflight.yml --ref main
#
# Needs three repo secrets from an App Store Connect API key (Admin role, so
# Xcode can create the distribution profiles and use cloud signing itself):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the whole .p8 file)

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    # Pinned so a runner image update can't change the compiler or SDK under us.
    # To move up: change both lines together, after checking the version is on the image.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Xcode stores the certificates it creates in the default keychain, so
      # give it an unlocked one of its own.
      - name: Set up signing
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then
            echo "::error::The ASC_KEY_P8 secret isn't set. See the comment at the top of testflight.yml."
            exit 1
          fi
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN"

      # Every upload needs a new build number; a re-run gets its own too.
      #
      # The archive is ad-hoc signed, with no certificate: signing it the normal
      # way made Xcode create a new Apple Development certificate on every run
      # (the runner is wiped, and with it the key), until the account hit
      # Apple's limit. Ad-hoc signing still embeds the entitlements (the App
      # Group the widgets share), and the upload step below re-signs the app
      # with the cloud-managed distribution certificate, which is reused.
      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project Catch.xcodeproj \
            -scheme Catch \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Catch.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY=- \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER= \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}.${{ github.run_attempt }}"

      # Stop before uploading if the App Group didn't make it into the app or
      # the widgets: without it they'd install fine but not share data.
      - name: Check entitlements
        run: |
          APP="$RUNNER_TEMP/Catch.xcarchive/Products/Applications/Catch.app"
          for bundle in "$APP" "$APP/PlugIns/CatchWidgets.appex"; do
            echo "== $bundle"
            codesign -d --entitlements - --xml "$bundle" | plutil -p - || true
            if ! codesign -d --entitlements - --xml "$bundle" | grep -q "group.com.buildmonkeys.catch"; then
              echo "::error::$(basename "$bundle") is missing the App Group entitlement"
              exit 1
            fi
          done

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Catch.xcarchive" \
            -exportOptionsPlist scripts/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
