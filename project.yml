name: Catch
options:
  bundleIdPrefix: com.jakefrenzel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # The App Group below needs a team to run on a device or upload.
    DEVELOPMENT_TEAM: S7G8QLJ85J
targets:
  Catch:
    type: application
    platform: iOS
    sources: [Catch]
    info:
      path: Catch/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.jakefrenzel.catch
            CFBundleURLSchemes: [catch]
        # The Action button's listening session keeps recording in the background.
        UIBackgroundModes: [audio]
        # Only Apple's built-in encryption (HTTPS etc.), so no export paperwork.
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Catch/Catch.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jakefrenzel.catch
    dependencies:
      - target: CatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakefrenzel.catch
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Catch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Catch listens only when you ask it to: while you hold +, after you tap the mic, or when you start it from the Action button, so you can say what's on your mind."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Catch uses your location only to remind you when you leave or reach a place you've saved."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Catch turns what you say into text. Most languages are recognized on your iPhone; for the rest, audio is sent to Apple to be recognized."
  CatchWidgets:
    type: app-extension
    platform: iOS
    sources:
      - CatchWidgets
      - Catch/Models
      - Catch/Logic
      - Catch/Settings
      - Catch/Shared
      - Catch/Design/Theme.swift
    info:
      path: CatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Catch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: CatchWidgets/CatchWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.jakefrenzel.catch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jakefrenzel.catch.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        # Widget buttons' intents run in the app; this keeps their app-only code out.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
  CatchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [CatchTests]
    dependencies:
      - target: Catch
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Catch:
    build:
      targets:
        Catch: all
        CatchTests: [test]
    test:
      targets: [CatchTests]
    run:
      commandLineArguments:
        "-seedSampleData": true
